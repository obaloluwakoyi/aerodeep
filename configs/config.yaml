# AeroDeep System Configuration
# configs/config.yaml

project:
  name: aerodeep-fault-diagnostic
  version: "1.0.0"
  environment: production  # development | staging | production

# ─── Kafka ───────────────────────────────────────────────────────────────────
kafka:
  bootstrap_servers: "localhost:9092"
  topics:
    telemetry: "aerodeep.telemetry.raw"
    telemetry_processed: "aerodeep.telemetry.processed"
    logs_raw: "aerodeep.logs.raw"
    alerts: "aerodeep.alerts"
  consumer_group: "aerodeep-ingestion"
  auto_offset_reset: "earliest"
  max_poll_records: 500

# ─── TimescaleDB ─────────────────────────────────────────────────────────────
timescaledb:
  host: localhost
  port: 5432
  database: aerodeep_ts
  user: aerodeep
  password: "${TIMESCALEDB_PASSWORD}"
  pool_size: 10
  chunk_time_interval: "1 day"
  retention_policy: "90 days"

# ─── pgvector ────────────────────────────────────────────────────────────────
pgvector:
  host: localhost
  port: 5432
  database: aerodeep_vectors
  user: aerodeep
  password: "${PGVECTOR_PASSWORD}"
  embedding_dim: 768
  index_type: ivfflat        # ivfflat | hnsw
  n_lists: 100               # for ivfflat

# ─── Sensor Stream A ─────────────────────────────────────────────────────────
stream_a:
  sensors:
    - id: LP_PRESSURE
      unit: bar
      normal_range: [10.0, 45.0]
      critical_threshold: 50.0
    - id: HP_PRESSURE
      unit: bar
      normal_range: [80.0, 180.0]
      critical_threshold: 195.0
    - id: LP_TEMPERATURE
      unit: celsius
      normal_range: [35.0, 80.0]
      critical_threshold: 90.0
    - id: HP_TEMPERATURE
      unit: celsius
      normal_range: [120.0, 200.0]
      critical_threshold: 215.0
    - id: INTERCOOLER_TEMP
      unit: celsius
      normal_range: [30.0, 55.0]
      critical_threshold: 65.0
    - id: LP_BEARING_VIB_X
      unit: mm/s
      normal_range: [0.0, 4.5]
      critical_threshold: 7.0
    - id: LP_BEARING_VIB_Y
      unit: mm/s
      normal_range: [0.0, 4.5]
      critical_threshold: 7.0
    - id: HP_BEARING_VIB_X
      unit: mm/s
      normal_range: [0.0, 4.5]
      critical_threshold: 7.0
    - id: HP_BEARING_VIB_Y
      unit: mm/s
      normal_range: [0.0, 4.5]
      critical_threshold: 7.0
    - id: SHAFT_RPM
      unit: rpm
      normal_range: [1450.0, 1510.0]
      critical_threshold: 1550.0
    - id: LUBE_OIL_PRESSURE
      unit: bar
      normal_range: [2.5, 6.0]
      critical_threshold: 1.8
    - id: SEAL_GAS_FLOW
      unit: Nm3/hr
      normal_range: [40.0, 120.0]
      critical_threshold: 30.0

  preprocessing:
    window_size_ms: 512
    overlap_ratio: 0.5
    sampling_rate_hz: 1000
    normalisation: z_score    # z_score | min_max | robust
    fft_bins: 256
    wavelet: db4              # for wavelet features

# ─── Log Stream B ────────────────────────────────────────────────────────────
stream_b:
  sources:
    - type: pdf
      watch_dir: /data/maintenance_reports
      glob_pattern: "*.pdf"
    - type: text
      watch_dir: /data/shift_logs
      glob_pattern: "*.txt"
    - type: text
      watch_dir: /data/shift_logs
      glob_pattern: "*.log"

  ocr:
    engine: tesseract
    language: eng
    dpi: 300

  embedding:
    model: "sentence-transformers/all-roberta-large-v1"
    # Alternative: "BAAI/bge-large-en-v1.5" (better for technical text)
    batch_size: 32
    max_length: 512
    device: cuda              # cuda | cpu | mps

  abbrev_dict_path: configs/abbreviations.yaml

# ─── Graph ───────────────────────────────────────────────────────────────────
graph:
  nodes:
    - id: lp_cylinder
      label: "Low-Pressure Cylinder"
      sensors: [LP_PRESSURE, LP_TEMPERATURE, LP_BEARING_VIB_X, LP_BEARING_VIB_Y]
    - id: intercooler
      label: "Intercooler"
      sensors: [INTERCOOLER_TEMP]
    - id: hp_cylinder
      label: "High-Pressure Cylinder"
      sensors: [HP_PRESSURE, HP_TEMPERATURE, HP_BEARING_VIB_X, HP_BEARING_VIB_Y]
    - id: shaft_coupling
      label: "Shaft Coupling"
      sensors: [SHAFT_RPM]
    - id: lube_oil_system
      label: "Lube Oil System"
      sensors: [LUBE_OIL_PRESSURE]
    - id: seal_system
      label: "Mechanical Seal System"
      sensors: [SEAL_GAS_FLOW]

  edges:
    - source: lp_cylinder
      target: intercooler
      relation: fluid_flow
      weight: 1.0
    - source: intercooler
      target: hp_cylinder
      relation: fluid_flow
      weight: 1.0
    - source: shaft_coupling
      target: lp_cylinder
      relation: mechanical_drive
      weight: 0.9
    - source: shaft_coupling
      target: hp_cylinder
      relation: mechanical_drive
      weight: 0.9
    - source: lube_oil_system
      target: lp_cylinder
      relation: lubrication
      weight: 0.8
    - source: lube_oil_system
      target: hp_cylinder
      relation: lubrication
      weight: 0.8
    - source: lube_oil_system
      target: shaft_coupling
      relation: lubrication
      weight: 0.7
    - source: seal_system
      target: hp_cylinder
      relation: sealing
      weight: 0.85
    - source: hp_cylinder
      target: lp_cylinder
      relation: thermal_proximity
      weight: 0.4
    - source: lp_cylinder
      target: shaft_coupling
      relation: structural_proximity
      weight: 0.5

# ─── ST-GCN Model ────────────────────────────────────────────────────────────
model:
  # Fusion
  timeseries_dim: 128         # output dim of time-series encoder
  text_dim: 768               # BERT embedding dim
  fusion_dim: 256             # projected shared space

  # ST-GCN
  hidden_channels: [256, 128, 64]
  temporal_kernel_size: 9
  num_layers: 4
  dropout: 0.3
  activation: gelu

  # Dual heads
  ttf_head:
    hidden: [64, 32]
    output: 1                 # hours to failure
    loss: huber               # huber | mse | mae

  fault_head:
    hidden: [64, 32]
    num_classes: 18           # (component × fault_type) combinations
    loss: bce_with_logits
    threshold: 0.45

# ─── Training ────────────────────────────────────────────────────────────────
training:
  epochs: 120
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 1.0e-5
  scheduler: cosine_with_warmup
  warmup_steps: 500
  grad_clip: 1.0

  # Multi-task loss weights
  ttf_loss_weight: 0.4
  fault_loss_weight: 0.6

  early_stopping:
    monitor: val_fault_f1
    patience: 15
    mode: max

  checkpoint_dir: checkpoints/
  wandb_project: aerodeep-fault-diag

# ─── API ─────────────────────────────────────────────────────────────────────
api:
  host: 0.0.0.0
  port: 8000
  workers: 4
  model_checkpoint: checkpoints/best_model.ckpt
  inference_batch_size: 1
  cors_origins:
    - "http://localhost:8501"   # Streamlit
    - "https://aerodeep.internal"

# ─── Dashboard ───────────────────────────────────────────────────────────────
dashboard:
  api_url: "http://localhost:8000"
  refresh_interval_seconds: 5
  risk_thresholds:
    low: 0.3
    medium: 0.6
    high: 0.85
  max_log_history: 50

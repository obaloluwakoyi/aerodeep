version: "3.9"

services:

  # ── TimescaleDB (sensor telemetry store) ─────────────────────────────────────
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: aerodeep-timescaledb
    environment:
      POSTGRES_USER: aerodeep
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-aerodeep_dev}
      POSTGRES_DB: aerodeep_ts
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerodeep -d aerodeep_ts"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── pgvector (vector store for log embeddings) ────────────────────────────────
  pgvector:
    image: pgvector/pgvector:pg15
    container_name: aerodeep-pgvector
    environment:
      POSTGRES_USER: aerodeep
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-aerodeep_dev}
      POSTGRES_DB: aerodeep_vectors
    ports:
      - "5433:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerodeep -d aerodeep_vectors"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka + Zookeeper (telemetry streaming) ───────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aerodeep-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aerodeep-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka

  # ── AeroDeep Inference API ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aerodeep-api
    command: ["uvicorn", "milestone3.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    environment:
      AERODEEP_CONFIG: /app/configs/config.yaml
      AERODEEP_CHECKPOINT: /app/checkpoints/best_model.ckpt
      TIMESCALEDB_PASSWORD: ${TIMESCALEDB_PASSWORD:-aerodeep_dev}
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD:-aerodeep_dev}
    ports:
      - "8000:8000"
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
    depends_on:
      timescaledb:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Streamlit Dashboard ───────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aerodeep-dashboard
    command: ["streamlit", "run", "milestone3/dashboard/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      AERODEEP_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
    volumes:
      - ./configs:/app/configs:ro

volumes:
  timescaledb_data:
  pgvector_data:
  zookeeper_data:
  kafka_data:
